<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6DCC8">
<title>CAFELINO: EL LOCAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 15%,#FFF1DC,#F6D6C6 55%,#DCC6EC);font-family:'Fredoka','Nunito',sans-serif;color:#4B3653}
#game{position:relative;overflow:hidden;border-radius:1.2em;box-shadow:0 1em 3em rgba(110,70,120,.25)}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none;cursor:pointer}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:1.2em;z-index:5}
.screen.show{display:flex}
.dim{background:rgba(74,53,83,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.card{background:#FFF7EA;border-radius:1.6em;padding:1.3em 1.4em 1.4em;width:100%;max-width:31em;text-align:center;box-shadow:0 .5em 0 #EBD8F6,0 1.2em 2.4em rgba(80,50,90,.28);max-height:100%;overflow-y:auto}
.card h3{font-size:1.9em;color:#8E6CC9;line-height:1.1;margin:.15em 0 .45em;font-weight:700}
.card h4{font-size:1.2em;color:#8E6CC9;margin:.9em 0 .4em;font-weight:600}
.kicker{font-size:1em;color:#D08A66;font-weight:600}
.card p,.card li{font-family:'Nunito',sans-serif;font-size:1.05em;line-height:1.4;font-weight:700;color:#5C4664}
.card ul{list-style:none;text-align:left;margin:.6em 0 1em}
.card li{background:#fff;border-radius:1em;padding:.5em .8em;margin:.35em 0;display:flex;gap:.6em;align-items:flex-start}
.card li .dot{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:#B99BE3;color:#fff;font-family:'Fredoka';display:flex;align-items:center;justify-content:center;font-size:.85em;margin-top:.05em}
.btn{font-family:'Fredoka',sans-serif;font-size:1.35em;font-weight:600;padding:.55em 1.3em;border:none;border-radius:1.1em;background:#8E6CC9;color:#fff;box-shadow:0 .22em 0 #6A4FA0;cursor:pointer;min-height:2.4em;margin-top:.4em}
.btn:active{transform:translateY(.15em);box-shadow:0 .07em 0 #6A4FA0}
.btn.ghost{background:#fff;color:#8E6CC9;box-shadow:0 .22em 0 #EADCF5}
.btn.mint{background:#5DB08A;box-shadow:0 .22em 0 #3F8C69}
#hudBtns{position:absolute;top:1.5em;right:1em;display:flex;gap:.5em;z-index:8}
.iconbtn{width:2.9em;height:2.9em;border-radius:50%;border:none;background:#FFF7EA;box-shadow:0 .2em 0 #E2CFF0,0 .4em .8em rgba(80,50,90,.15);display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:1.5em;height:1.5em}
.iconbtn:active{transform:translateY(.12em)}
/* title */
#sTitle{justify-content:space-between;padding:2.2em 1em 3.4em;cursor:pointer}
#sTitle .top{display:flex;flex-direction:column;align-items:center}
#logoC{width:7em;height:7em}
#sTitle h1{font-size:4.1em;font-weight:700;color:#8E6CC9;letter-spacing:.03em;line-height:.95;text-shadow:0 .06em 0 #fff,0 .18em .4em rgba(142,108,201,.25)}
#sTitle h2{font-size:1.5em;letter-spacing:.45em;color:#D08A66;font-weight:600;margin:.2em 0 0 .45em}
#sTitle .bottom{display:flex;flex-direction:column;align-items:center;gap:.7em}
.tapmsg{font-size:1.6em;font-weight:600;color:#fff;background:#8E6CC9;padding:.55em 1.3em;border-radius:2em;box-shadow:0 .2em 0 #6A4FA0;animation:pulse 1.5s ease-in-out infinite}
.rec{font-family:'Nunito';font-weight:800;color:#6A4F7A;background:rgba(255,247,234,.85);padding:.35em .9em;border-radius:1em;font-size:1em}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* promo */
.money{display:inline-flex;align-items:center;gap:.4em;background:#fff;border-radius:2em;padding:.35em 1em;font-size:1.3em;font-weight:700;color:#6B4632;margin-bottom:.4em}
.coin{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;background:#FFD36E;box-shadow:inset 0 0 0 .12em #E8B44A}
.pcard{display:flex;align-items:center;gap:.8em;width:100%;text-align:left;background:#fff;border:.13em solid #EADCF5;border-radius:1.2em;padding:.7em .8em;margin:.5em 0;font-family:inherit;color:inherit;cursor:pointer;box-shadow:0 .22em 0 #EADCF5;font-size:1em}
.pcard:active:not(:disabled){transform:translateY(.12em);box-shadow:0 .08em 0 #EADCF5}
.pcard:disabled{opacity:.55;cursor:default}
.pcard .pic{width:3.6em;height:3.6em;flex:none;border-radius:1em;display:flex;align-items:center;justify-content:center}
.pcard .pic svg{width:2.4em;height:2.4em}
.pcard .pt{flex:1;line-height:1.25}
.pcard .pt b{font-size:1.25em;color:#8E6CC9;font-weight:700}
.pcard .pt small{display:block;font-family:'Nunito';font-weight:700;font-size:.92em;color:#6C5875;margin-top:.15em}
.pcard .cost{flex:none;background:#FFD36E;color:#6B4632;font-weight:700;border-radius:1em;padding:.4em .7em;font-size:1.15em;min-width:3.4em;text-align:center}
.pcard .cost.done{background:#CFF1E2;color:#3F8C69;font-size:.95em}
.dots{margin-top:.3em}.dots i{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#EADCF5;margin-right:.25em}.dots i.on{background:#8E6CC9}
.hintp{font-size:.95em!important;opacity:.85;margin-top:.3em}
/* gen */
.promptbox{background:#3A2E46;color:#F3ECFF;border-radius:1em;padding:.7em .9em;text-align:left;font-family:'Nunito';font-weight:700;font-size:1em;min-height:3.6em;line-height:1.35;margin:.5em 0 .7em}
.promptbox .lbl{display:block;font-family:'Fredoka';font-weight:500;color:#C9B3F0;font-size:.85em;margin-bottom:.15em}
.caret{display:inline-block;width:.5em;height:1em;background:#C9B3F0;vertical-align:-.12em;margin-left:.1em;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#gnC{width:14em;height:17.1em;border-radius:1.2em;background:#fff;box-shadow:0 .3em 1em rgba(80,50,90,.2)}
.bar{height:.7em;background:#EADCF5;border-radius:1em;overflow:hidden;margin:.8em auto .4em;width:80%}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#B99BE3,#FFC6A5)}
#gnStatus{min-height:2.8em}
/* final & shift */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.5em;margin:.7em 0}
.stats div{background:#fff;border-radius:1em;padding:.55em .4em}
.stats b{display:block;font-size:1.7em;color:#8E6CC9;font-weight:700;line-height:1.1}
.stats span{font-family:'Nunito';font-weight:700;font-size:.9em;color:#6C5875}
.phr{background:#FFE9D6;border-radius:1em;padding:.6em .9em;margin:.4em 0;font-family:'Fredoka';font-weight:600;font-size:1.15em;color:#B0603A}
.starrow svg{width:2.3em;height:2.3em;margin:0 .08em}
.piece{display:flex;gap:.6em;align-items:center;background:#fff;border-radius:1em;padding:.5em .7em;margin:.35em 0;text-align:left}
.piece svg{width:2em;height:2em;flex:none}
.piece div{font-family:'Nunito';font-weight:700;font-size:.9em;color:#5C4664;line-height:1.3}
.piece div b{font-family:'Fredoka';font-weight:600;color:#8E6CC9;font-size:1.05em}
.newrec{display:inline-block;background:#FFD36E;color:#6B4632;border-radius:1em;padding:.25em .8em;font-weight:700;margin-top:.4em}
@media (prefers-reduced-motion:reduce){.tapmsg,.caret{animation:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div id="hudBtns" style="display:none">
    <button class="iconbtn" id="btnPause" aria-label="Pausa"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="2" fill="#8E6CC9"/><rect x="14" y="5" width="4" height="14" rx="2" fill="#8E6CC9"/></svg></button>
    <button class="iconbtn" id="btnMute" aria-label="Sonido"></button>
  </div>

  <div id="sTitle" class="screen show">
    <div class="top">
      <canvas id="logoC" width="280" height="280"></canvas>
      <h1>CAFELINO</h1>
      <h2>EL LOCAL</h2>
    </div>
    <div class="bottom">
      <div class="tapmsg">Tocá para abrir el local</div>
      <div class="rec" id="recTitle"></div>
    </div>
  </div>

  <div id="sIntro" class="screen dim"><div class="card">
    <div class="kicker" id="inK"></div>
    <h3 id="inT"></h3>
    <div id="inBody"></div>
    <button class="btn" id="inGo">¡A atender!</button>
  </div></div>

  <div id="sShift" class="screen dim"><div class="card">
    <div class="kicker" id="shK"></div>
    <h3 id="shT"></h3>
    <div id="shBody"></div>
    <button class="btn" id="shGo"></button>
  </div></div>

  <div id="sPromo" class="screen dim"><div class="card">
    <h3>Promocioná tu local con IA</h3>
    <div class="money"><span class="coin"></span><span id="prMoney"></span> en propinas</div>
    <div id="prCards"></div>
    <p class="hintp">Las piezas que generás quedan para toda la semana (el reel dura un turno).</p>
    <button class="btn mint" id="prGo"></button>
  </div></div>

  <div id="sGen" class="screen dim"><div class="card">
    <div class="kicker" id="gnK"></div>
    <div class="promptbox"><span class="lbl">Prompt</span><span id="gnPrompt"></span><i class="caret"></i></div>
    <canvas id="gnC" width="360" height="440"></canvas>
    <div class="bar"><i id="gnBar"></i></div>
    <p id="gnStatus"></p>
    <button class="btn" id="gnGo" style="visibility:hidden">¡Publicar!</button>
  </div></div>

  <div id="sFinal" class="screen dim"><div class="card" id="fnCard"></div></div>

  <div id="sPause" class="screen dim"><div class="card">
    <h3>Pausa</h3>
    <p>El café te espera calentito.</p>
    <button class="btn" id="paGo">Seguir atendiendo</button><br>
    <button class="btn ghost" id="paQuit">Volver al inicio</button>
  </div></div>
</div>

<script>
'use strict';
/* ================== CONSTANTES ================== */
const W=720,H=1280,TW=100,TH=50,OX=360,OY=385,N=7,WH=175,CH=52,SHIFT_LEN=60;
const C={lila:'#B99BE3',lilaD:'#8E6CC9',lilaL:'#DCCBF5',crema:'#FFF6E8',madera:'#E6BE8E',maderaD:'#C99A68',durazno:'#FFC6A5',duraznoD:'#F2A783',menta:'#9EDCC2',mentaD:'#5DB08A',ink:'#4B3653',gold:'#FFD36E'};
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let SC=1,DPR=1,ANIM=0,LAST=performance.now(),MUTED=false;

const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
function P(gx,gy,z){return [OX+(gx-gy)*TW/2, OY+(gx+gy)*TH/2-(z||0)];}
function S2G(sx,sy){const a=(sx-OX)/(TW/2),b=(sy-OY)/(TH/2);return [(a+b)/2,(b-a)/2];}

const ITEMS={
  cafe:{name:'Café',time:2.4,tip:3},
  leche:{name:'Café con leche',time:3.2,tip:4},
  medialunas:{name:'Medialunas',time:1.6,tip:3},
  tostado:{name:'Tostado',time:4.0,tip:5},
  torta:{name:'Porción de torta',time:2.2,tip:5}
};
const STATIONS=[
  {id:'cafe',label:'Café',gx:0.95,unlock:1},
  {id:'leche',label:'C/ leche',gx:1.95,unlock:1},
  {id:'medialunas',label:'Medialunas',gx:2.95,unlock:1},
  {id:'tostado',label:'Tostado',gx:3.95,unlock:2},
  {id:'torta',label:'Torta',gx:4.95,unlock:3}
].map(s=>Object.assign(s,{gy:0.63,state:'idle',t:0,readyT:0,bounce:0}));

const DAYS=[
  {spawn:6.0,combo:0.12,pat:30},
  {spawn:5.0,combo:0.30,pat:27},
  {spawn:4.3,combo:0.42,pat:24},
  {spawn:3.7,combo:0.55,pat:21},
  {spawn:3.2,combo:0.68,pat:19}
];

const TABLES=[[245,480],[200,600],[520,600],[360,700]].map(([x,y],i)=>{const g=S2G(x,y);return{gx:g[0],gy:g[1],i};});
const SEATS=[];
TABLES.forEach(t=>[-1,1].forEach(sd=>SEATS.push({gx:t.gx+sd*0.55,gy:t.gy-sd*0.55,table:t,side:sd,occ:null,col:sd<0?C.lila:C.menta})));
const ENTRY=[6.25,0.3], W1=S2G(520,530), HUB=S2G(370,565);
const PLANTS=[[0.45,6.55],[6.75,0.8]];

const SKINS=['#F9D7BE','#EFC1A0','#D9A07A','#B97D57','#8D5A3B','#FBE3CF'];
const HAIRS=['#3B2A26','#6B4632','#C98A4B','#2B2230','#E8C46A','#9C5B3C','#B7B0BC'];
const SHIRTS=['#B99BE3','#9EDCC2','#FFC6A5','#F7A8C0','#A9C8F0','#F6D57A','#E6BE8E','#C7E89B'];
const PANTS=['#6E5A7E','#5D6C8A','#7A5A48','#4F5E5A'];

const PROMPTS={
  img:['Flyer de una taza lila con cara de gato, medialunas, luz cálida de mañana',
       'Flyer estilo acuarela: Cafelino, tortas caseras y una ventana con sol de tarde',
       'Póster pastel lila y crema: "Merendá en Cafelino", gato negro guiñando un ojo'],
  voz:['Jingle bossa nova suave, voz alegre que canta "Cafelino, tu rincón del barrio"',
       'Música lo-fi con ronroneo de gato y tazas que tintinean, 20 segundos',
       'Locución cálida en rioplatense: "Pasá por Cafelino, las medialunas te esperan"'],
  vid:['Reel vertical de 15 segundos: vapor de café en cámara lenta, gato negro y medialunas doradas',
       'Reel "un día en Cafelino": timelapse del local de mañana a tarde, música bossa',
       'Reel con tendencia: la taza lila baila al ritmo del jingle del local']
};
const ICONS={
  img:'<svg viewBox="0 0 48 48"><rect x="5" y="7" width="38" height="34" rx="8" fill="#B99BE3"/><circle cx="17" cy="19" r="5" fill="#FFF6E8"/><path d="M9 37 L20 26 L28 33 L34 27 L40 33 L40 37 Z" fill="#8E6CC9"/></svg>',
  voz:'<svg viewBox="0 0 48 48"><rect x="17" y="5" width="14" height="24" rx="7" fill="#5DB08A"/><path d="M11 23 a13 13 0 0 0 26 0" stroke="#5DB08A" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="22" y="35" width="4" height="7" rx="2" fill="#5DB08A"/><rect x="15" y="41" width="18" height="4" rx="2" fill="#5DB08A"/></svg>',
  vid:'<svg viewBox="0 0 48 48"><rect x="12" y="3" width="24" height="42" rx="6" fill="#F2A783"/><rect x="15" y="8" width="18" height="30" rx="3" fill="#FFF6E8"/><path d="M21 17 L29 23 L21 29 Z" fill="#F2A783"/></svg>'
};
const SVG_SOUND_ON='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#8E6CC9"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#8E6CC9" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const SVG_SOUND_OFF='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#B7A6CC"/><path d="M16 9l5 6M21 9l-5 6" stroke="#B7A6CC" stroke-width="2" stroke-linecap="round"/></svg>';

/* ================== ESTADO ================== */
let G={};
function newGame(state){
  G={state:state,day:0,shift:0,time:0,money:0,totalTips:0,served:0,lost:0,stars:3,burned:0,hearts:0,
     shiftTips:0,shiftServed:0,shiftLost:0,shiftBurned:0,
     tray:[],trayPop:[0,0,0],trayArm:-1,trayArmT:0,customers:[],floaters:[],flys:[],toasts:[],
     spawnT:1,flyerLvl:0,jingleLvl:0,videoNext:false,peakPlanned:false,peakActive:false,
     pieces:[],paused:false,door:0,demoT:0.5};
  STATIONS.forEach(s=>{s.state='idle';s.t=0;s.readyT=0;s.bounce=0;});
  SEATS.forEach(s=>s.occ=null);
}
function loadRecord(){try{return JSON.parse(localStorage.getItem('cafelino_record'))||null;}catch(e){return null;}}
function saveRecord(r){try{localStorage.setItem('cafelino_record',JSON.stringify(r));}catch(e){}}

/* ================== AUDIO ================== */
const AU={ctx:null,playing:false,next:0,step:0};
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  try{
    const a=AU.ctx=new AC();
    AU.master=a.createGain();AU.master.gain.value=MUTED?0:0.9;
    const comp=a.createDynamicsCompressor();AU.master.connect(comp);comp.connect(a.destination);
    AU.music=a.createGain();AU.music.gain.value=0.5;
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
    AU.music.connect(lp);lp.connect(AU.master);
    AU.sfx=a.createGain();AU.sfx.gain.value=0.7;AU.sfx.connect(AU.master);
    const len=a.sampleRate;AU.noise=a.createBuffer(1,len,a.sampleRate);
    const d=AU.noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    AU.next=a.currentTime+0.1;
    setInterval(schedMusic,25);
  }catch(e){AU.ctx=null;}
}
function tone(f,t,dur,vol,type,dest,att,f2){
  const a=AU.ctx;const o=a.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(att||0.01));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||AU.sfx);o.start(t);o.stop(t+dur+0.05);
}
function noise(t,dur,vol,type,freq,dest,q){
  const a=AU.ctx;const s=a.createBufferSource();s.buffer=AU.noise;
  const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;
  const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||AU.sfx);
  s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
}
const ok=()=>AU.ctx&&!MUTED;
const now=()=>AU.ctx.currentTime;
const sfx={
  bell(){if(!ok())return;const t=now();[0,0.14].forEach((d,i)=>[[1318,0.08],[2637,0.035],[3951,0.015]].forEach(([f,v])=>tone(f*(i?0.89:1),t+d,1.0,v,'sine',AU.sfx,0.003)));},
  ding(){if(!ok())return;const t=now();tone(1568,t,0.5,0.1,'sine',AU.sfx,0.004);tone(2349,t+0.06,0.6,0.06,'sine',AU.sfx,0.004);},
  coins(){if(!ok())return;const t=now();[1975,2637,3135].forEach((f,i)=>{tone(f,t+i*0.07,0.16,0.05,'triangle',AU.sfx,0.002);tone(f*1.5,t+i*0.07,0.1,0.015,'sine');});},
  pop(){if(!ok())return;tone(520,now(),0.14,0.07,'sine',AU.sfx,0.005,1040);},
  click(){if(!ok())return;tone(700,now(),0.07,0.05,'triangle',AU.sfx,0.003);},
  ready(){if(!ok())return;const t=now();tone(1046,t,0.2,0.05);tone(1318,t+0.08,0.28,0.05);},
  steam(){if(!ok())return;noise(now(),0.9,0.04,'bandpass',2600,AU.sfx,0.8);},
  nope(){if(!ok())return;const t=now();tone(330,t,0.13,0.05,'triangle');tone(262,t+0.1,0.18,0.05,'triangle');},
  angry(){if(!ok())return;const t=now();tone(240,t,0.45,0.05,'sawtooth',AU.sfx,0.02,120);noise(t,0.3,0.03,'lowpass',600);},
  burn(){if(!ok())return;noise(now(),0.9,0.06,'lowpass',900);},
  trash(){if(!ok())return;noise(now(),0.25,0.06,'bandpass',500,AU.sfx,1.5);},
  sparkle(){if(!ok())return;const t=now();[72,76,79,84,88,91].forEach((m,i)=>tone(mtof(m),t+i*0.07,0.4,0.04,'sine',AU.sfx,0.004));},
  fanfare(){if(!ok())return;const t=now();[[60,0],[64,0.12],[67,0.24],[72,0.36]].forEach(([m,d])=>{tone(mtof(m),t+d,0.4,0.05,'triangle');tone(mtof(m+12),t+d,0.3,0.02,'sine');});},
  jingle(){if(!ok())return;const t=now();const notes=[[72,0,.25],[76,.25,.25],[79,.5,.5],[81,1,.25],[79,1.25,.25],[76,1.5,.5],[74,2,.25],[76,2.25,.25],[72,2.5,.9]];
    notes.forEach(([m,d,l])=>{tone(mtof(m),t+d,l+0.25,0.07,'triangle',AU.sfx,0.02);tone(mtof(m+12),t+d,l+0.2,0.015,'sine');});
    [[48,0],[45,1],[50,2]].forEach(([m,d])=>[0,4,7].forEach(k=>tone(mtof(m+12+k),t+d,0.9,0.025,'sine')));}
};
/* música lo-fi / bossa */
const STEP=60/90/4;
const PROG=[{b:48,n:[64,67,71,74]},{b:45,n:[60,64,67,71]},{b:50,n:[60,65,69,72]},{b:43,n:[59,62,65,69]}];
const MEL={0:76,4:79,6:81,8:79,12:76,16:72,20:76,24:74,28:72,32:77,35:76,38:74,42:72,48:71,52:74,56:79,60:77};
function schedMusic(){
  if(!AU.ctx)return;
  const want=AU.playing&&!G.paused;
  if(!want){AU.next=AU.ctx.currentTime+0.05;return;}
  while(AU.next<AU.ctx.currentTime+0.15){playStep(AU.step,AU.next);AU.next+=STEP;AU.step=(AU.step+1)%64;}
}
function playStep(s,t){
  const bar=Math.floor(s/16),st=s%16,ch=PROG[bar],M=AU.music;
  if(st===0||st===8){tone(mtof(ch.b),t,0.5,0.13,'sine',M,0.01);tone(mtof(ch.b),t,0.25,0.03,'triangle',M,0.01);}
  if(st===6||st===14)tone(mtof(ch.b+7),t,0.4,0.1,'sine',M,0.01);
  if([0,3,6,10,13].indexOf(st)>=0)ch.n.forEach((m,i)=>tone(mtof(m),t+i*0.006,0.34,0.022,'triangle',M,0.01));
  if(st%2===0)noise(t,0.05,st%4===2?0.025:0.012,'highpass',7000,M);
  if(st===4||st===11)noise(t,0.04,0.035,'bandpass',1900,M,3);
  if(G.peakActive&&st%2===1)noise(t,0.04,0.012,'highpass',8000,M);
  if(Math.random()<0.12)noise(t,0.02,0.006,'highpass',3000,M);
  if(G.jingleLvl>0&&MEL[s]!==undefined){
    tone(mtof(MEL[s]),t,0.5,0.045,'sine',M,0.03);
    if(G.jingleLvl>1)tone(mtof(MEL[s]-12),t+STEP*3,0.45,0.03,'triangle',M,0.03);
    if(G.jingleLvl>2)tone(mtof(MEL[s]+7),t+STEP*2,0.3,0.015,'sine',M,0.02);
  }
}

/* ================== DIBUJO: HELPERS ================== */
function rrect(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function poly(c,pts,fill){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();if(fill){c.fillStyle=fill;c.fill();}}
function ell(c,x,y,rx,ry,fill){c.beginPath();c.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}}
function circ(c,x,y,r,fill){c.beginPath();c.arc(x,y,Math.max(0.01,r),0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}}
function isoT(c,z){c.transform(TW/2,TH/2,-TW/2,TH/2,OX,OY-(z||0));}
function isoCircle(c,gx,gy,r,z,fill){c.save();isoT(c,z);c.beginPath();c.arc(gx,gy,r,0,Math.PI*2);c.restore();c.fillStyle=fill;c.fill();}
function font(c,w,s){c.font=w+' '+s+'px Fredoka, Nunito, sans-serif';}
function txt(c,s,x,y,col,align,outline){c.textAlign=align||'center';c.textBaseline='middle';if(outline){c.lineJoin='round';c.lineWidth=outline;c.strokeStyle='#fff';c.strokeText(s,x,y);}c.fillStyle=col;c.fillText(s,x,y);}
function starPath(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.48:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();}
function drawStars(c,x,y,r,val,gap){for(let i=0;i<5;i++){const cx=x+i*gap;starPath(c,cx,y,r);c.fillStyle='#EADCF5';c.fill();const fr=clamp(val-i,0,1);if(fr>0){c.save();c.beginPath();c.rect(cx-r,y-r,2*r*fr,2*r);c.clip();starPath(c,cx,y,r);c.fillStyle='#FFC94D';c.fill();c.restore();}}}
function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*0.35);c.bezierCurveTo(x-s*0.95,y-s*0.25,x-s*0.45,y-s*0.95,x,y-s*0.42);c.bezierCurveTo(x+s*0.45,y-s*0.95,x+s*0.95,y-s*0.25,x,y+s*0.35);c.closePath();}
function coin(c,x,y,r){circ(c,x,y,r,'#E8B44A');circ(c,x,y,r*0.82,C.gold);font(c,700,r*1.1);txt(c,'$',x,y+r*0.05,'#B07A26');}
function drawSteam(c,x,y,h,t,lw){c.save();c.lineCap='round';for(let i=0;i<3;i++){const ph=((t*0.55+i/3)%1);const a=Math.sin(ph*Math.PI)*0.75;c.strokeStyle='rgba(255,255,255,'+a.toFixed(3)+')';c.lineWidth=lw;const ox=(i-1)*h*0.26,yy=y-ph*h*0.5;c.beginPath();c.moveTo(x+ox,yy);c.bezierCurveTo(x+ox+h*0.16,yy-h*0.14,x+ox-h*0.16,yy-h*0.3,x+ox,yy-h*0.45);c.stroke();}c.restore();}

function makeLook(){return{skin:pick(SKINS),hair:pick(HAIRS),shirt:pick(SHIRTS),pants:pick(PANTS),style:Math.floor(Math.random()*5),glasses:Math.random()<0.25,hat:pick(['#F7A8C0','#9EDCC2','#FFC6A5','#B99BE3'])};}
function drawPerson(c,x,y,L,o){
  c.save();c.globalAlpha*=(o.alpha==null?1:o.alpha);c.translate(x,y);
  const sq=o.squash||0;c.scale(1+sq*0.14,1-sq*0.14);

  const bob=walk?-Math.abs(Math.sin(walk))*3:0;
  if(!seated)ell(c,0,0,16,6,'rgba(80,45,90,.18)');
  const bb=(seated?-24:-10)+bob, hy=bb-44;
  // pelo largo atrás
  if(L.style===3){c.fillStyle=L.hair;rrect(c,-18,hy-14,36,40,15);c.fill();}
  // piernas
  c.fillStyle=L.pants;
  if(seated){rrect(c,-11,bb-4,9,13,4);c.fill();rrect(c,2,bb-4,9,13,4);c.fill();ell(c,-6.5,bb+9,5,3,'#5A4650');ell(c,6.5,bb+9,5,3,'#5A4650');}
  else{const sw=walk?Math.sin(walk)*3.5:0;rrect(c,-9,bb-3+(sw>0?-sw:0),8,13,4);c.fill();rrect(c,1,bb-3+(sw<0?sw:0),8,13,4);c.fill();
    ell(c,-5,bb+10+(sw>0?-sw:0),5,3,'#5A4650');ell(c,5,bb+10+(sw<0?sw:0),5,3,'#5A4650');}
  // cuerpo
  c.fillStyle=L.shirt;rrect(c,-15,bb-33,30,34,12);c.fill();
  c.fillStyle='rgba(255,255,255,.25)';rrect(c,-6,bb-33,12,5,3);c.fill();
  const arm=walk?Math.sin(walk)*3:0;
  c.fillStyle=L.shirt;rrect(c,-20,bb-28+arm,8,18,4);c.fill();rrect(c,12,bb-28-arm,8,18,4);c.fill();
  circ(c,-16,bb-9+arm,4.2,L.skin);circ(c,16,bb-9-arm,4.2,L.skin);
  // cabeza
  circ(c,0,hy,15,L.skin);
  c.fillStyle=L.hair;
  if(L.style===2){for(let a=-2.9;a<=-0.2;a+=0.45){circ(c,Math.cos(a)*14,hy+Math.sin(a)*13,7,L.hair);}}
  else if(L.style===4){c.fillStyle=L.hat;c.beginPath();c.ellipse(0,hy-6,16.5,12,0,Math.PI,0);c.fill();rrect(c,-17,hy-8,34,6,3);c.fill();circ(c,0,hy-19,4.5,'#fff');}
  else{c.beginPath();c.ellipse(0,hy-6,16,10.5,0,Math.PI,0);c.lineTo(16,hy-2);c.quadraticCurveTo(4,hy-10,-16,hy-2);c.closePath();c.fill();
    if(L.style===1)circ(c,0,hy-19,7,L.hair);}
  // cara
  const m=o.mood||'ok',ink='#3B2A33';

  ell(c,-9,hy+6,3.2,2,'rgba(247,140,160,.55)');ell(c,9,hy+6,3.2,2,'rgba(247,140,160,.55)');
  c.strokeStyle=ink;c.fillStyle=ink;c.lineWidth=1.8;c.lineCap='round';
  if(m==='happy'){[-5.5,5.5].forEach(ex=>{c.beginPath();c.arc(ex,hy+2,2.6,Math.PI*1.1,Math.PI*1.9);c.stroke();});
    c.fillStyle='#C2536B';c.beginPath();c.arc(0,hy+6,4.2,0.1,Math.PI-0.1);c.fill();}
  else{const blink=((o.t||0)%3.3)>3.15;
    [-5.5,5.5].forEach(ex=>{if(blink){c.beginPath();c.moveTo(ex-2,hy+1);c.lineTo(ex+2,hy+1);c.stroke();}else circ(c,ex,hy+1,2.1,ink);});
    if(m==='ok'){c.beginPath();c.arc(0,hy+5,3.5,0.25,Math.PI-0.25);c.stroke();}

    else{c.beginPath();c.moveTo(-9,hy-5);c.lineTo(-3,hy-2.5);c.moveTo(9,hy-5);c.lineTo(3,hy-2.5);c.stroke();

  c.restore();
}

function seatedNow(cu){return !cu.path.length&&cu.state!=='out'&&cu.state!=='in';}

function unlocked(){return STATIONS.filter(s=>s.unlock<=G.day+1).map(s=>s.id);}
function makeOrder(){
  const un=unlocked(),drinks=un.filter(i=>i==='cafe'||i==='leche'),foods=un.filter(i=>drinks.indexOf(i)<0);
  const d=DAYS[G.day],combo=Math.random()<d.combo*(G.shift?1.1:1);
  const wD=G.shift?{cafe:2,leche:4}:{cafe:3,leche:3},wF=G.shift?{medialunas:2,tostado:2,torta:4}:{medialunas:4,tostado:3,torta:1};
  const wp=(arr,w)=>{let tot=arr.reduce((s,i)=>s+(w[i]||1),0),r=Math.random()*tot;for(const i of arr){r-=(w[i]||1);if(r<=0)return i;}return arr[arr.length-1];};
  if(combo)return[wp(drinks,wD),wp(foods,wF)];
  return[Math.random()<0.5?wp(drinks,wD):wp(foods,wF)];
}
function pathTo(seat){const p=[W1.slice()];if(seat.table.i!==2)p.push(HUB.slice());p.push([seat.gx,seat.gy]);return p;}
function pathOut(seat){const p=[];if(seat&&seat.table.i!==2)p.push(HUB.slice());p.push(W1.slice(),ENTRY.slice());return p;}
function spawnCustomer(demo){
  const free=SEATS.filter(s=>!s.occ);if(!free.length)return false;
  const seat=pick(free);
  const cu={gx:ENTRY[0],gy:ENTRY[1],seat:seat,state:'in',alpha:0,walk:0,anim:Math.random()*5,bounce:0,shake:0,mood:'ok',demo:!!demo,timer:demo?rnd(4,7):0,look:makeLook(),order:[],pat:1,patMax:1};
  seat.occ=cu;cu.path=pathTo(seat);
  if(!demo){const d=DAYS[G.day];cu.order=makeOrder().map(t=>({t:t,done:false,coming:false}));
    cu.patMax=d.pat*(G.shift?0.94:1)*(1+0.22*G.jingleLvl)+(cu.order.length-1)*7;cu.pat=cu.patMax;}
  G.customers.push(cu);G.door=1;sfx.bell();
  return true;
}
function leave(cu,mood){cu.state='out';cu.mood=mood;const s=cu.seat;if(s){s.occ=null;}cu.path=pathOut(s);cu.seat=null;}
function updCustomer(cu,dt){
  cu.anim+=dt;if(cu.bounce>0)cu.bounce=Math.max(0,cu.bounce-dt*2.5);if(cu.shake>0)cu.shake-=dt;
  if(cu.path.length){const tp=cu.path[0],dx=tp[0]-cu.gx,dy=tp[1]-cu.gy,d=Math.hypot(dx,dy),sp=2.5*dt;
    if(d<=sp){cu.gx=tp[0];cu.gy=tp[1];cu.path.shift();}else{cu.gx+=dx/d*sp;cu.gy+=dy/d*sp;}cu.walk+=dt*11;}
  if(cu.state==='in'){cu.alpha=Math.min(1,cu.alpha+dt*3);if(!cu.path.length){cu.state=cu.demo?'demo':'wait';cu.bounce=1;if(!cu.demo)sfx.pop();}}
  else if(cu.state==='demo'){cu.timer-=dt;if(cu.timer<=0)leave(cu,'happy');}
  else if(cu.state==='wait'){if(G.state==='play'){cu.pat-=dt;if(cu.pat<=0){if(cu.order.some(o=>o.coming&&!o.done))cu.pat=0.01;else{cu.pat=0;getAngry(cu);}}}}
  else if(cu.state==='happy'){cu.timer-=dt;if(cu.timer<=0)leave(cu,'happy');}
  else if(cu.state==='out'){if(!cu.path.length){if(cu.alpha>=1)G.door=1;cu.alpha-=dt*3;if(cu.alpha<=0)cu.dead=true;}}
}
function getAngry(cu){

function serveDone(cu){

  if(G.peakActive)tip*=2;

function tapStation(i,fx,fy){
  const s=STATIONS[i];
  if(s.unlock>G.day+1){toast('Se desbloquea el día '+s.unlock);sfx.nope();return;}
  if(s.state==='idle'){s.state='prep';s.t=0;sfx.click();if(s.id==='cafe'||s.id==='leche')sfx.steam();}
  else if(s.state==='ready'){
    if(G.tray.length>=3){toast('¡La bandeja está llena!');sfx.nope();return;}
    G.tray.push(s.id);const k=G.tray.length-1;G.trayPop[k]=1;G.trayArm=-1;
    G.flys.push({it:s.id,x0:fx,y0:fy,x1:TRAY_X[k],y1:TRAY_Y,p:0,dur:0.35});
    s.state='idle';s.bounce=0;sfx.pop();
  }else if(s.state==='burnt'){s.state='idle';sfx.trash();}
  else{sfx.click();}
}
function tapCustomer(cu){
  if(cu.state!=='wait')return;let gave=0;
  cu.order.forEach((o,oi)=>{if(o.done||o.coming)return;const k=G.tray.indexOf(o.t);if(k<0)return;
    const x0=TRAY_X[k];G.tray.splice(k,1);G.trayArm=-1;o.coming=true;gave++;
    G.flys.push({it:o.t,x0:x0,y0:TRAY_Y,p:0,dur:0.45,target:()=>{const g=bubbleGeo(cu);return[g.x+31+oi*44,g.y+28];},
      cb:()=>{o.done=true;cu.bounce=1;sfx.ding();if(cu.state==='wait'&&cu.order.every(q=>q.done))serveDone(cu);}});});
  if(!gave){cu.shake=0.35;sfx.nope();if(!G.tray.length)toast('Primero prepará lo que pide');else toast('Eso no lo pidió');}
}
function hitCustomer(px,py){
  const list=G.customers.filter(c=>c.state==='wait').sort((a,b)=>(b.gx+b.gy)-(a.gx+a.gy));
  for(const cu of list){const g=bubbleGeo(cu);if(px>=g.x-8&&px<=g.x+g.w+8&&py>=g.y-8&&py<=g.y+g.h+14)return cu;}
  for(const cu of list){const [x,y]=P(cu.gx,cu.gy);if(Math.abs(px-x)<30&&py>y-98&&py<y+12)return cu;}
  return null;
}
function handleTap(px,py){
  for(let i=0;i<3;i++){if(Math.hypot((px-TRAY_X[i])/1.2,py-TRAY_Y)<52){
    if(G.tray[i]){if(G.trayArm===i){G.tray.splice(i,1);G.trayArm=-1;sfx.trash();toast('A la basura');}else{G.trayArm=i;G.trayArmT=1.6;sfx.click();}}return;}}
  for(let i=0;i<5;i++){const b=stBtn(i);if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){tapStation(i,b.x+b.w/2,b.y+70);return;}}
  if(py<785){
    const cu=hitCustomer(px,py);if(cu){tapCustomer(cu);return;}
    for(let i=0;i<5;i++){const s=STATIONS[i],[x,y]=P(s.gx,s.gy,CH);if(Math.abs(px-x)<26&&py>y-95&&py<y+12){tapStation(i,x,y-40);return;}}
  }
}
function toast(text,col){G.toasts.push({text:text,t:0,col:col});if(G.toasts.length>3)G.toasts.shift();}
function nextInterval(){let iv=DAYS[G.day].spawn*(G.shift?0.92:1)/(1+0.18*G.flyerLvl);if(G.peakActive)iv*=0.42;return iv*rnd(0.75,1.25);}

function update(dt){
  G.door=Math.max(0,G.door-dt*1.2);
  if(G.state==='title'){G.demoT-=dt;if(G.demoT<=0){spawnCustomer(true);G.demoT=rnd(1.6,3.2);}}
  if(G.state==='play'){
    G.time+=dt;
    if(G.peakPlanned){const on=G.time>=20&&G.time<40;if(on&&!G.peakActive){toast('¡Tu reel explotó! Llega gente',  '#E8742F');sfx.fanfare();G.spawnT=0.3;}G.peakActive=on;}
    if(G.time<52){G.spawnT-=dt;if(G.spawnT<=0)G.spawnT=spawnCustomer(false)?nextInterval():0.8;}
    STATIONS.forEach(s=>{
      if(s.bounce>0)s.bounce=Math.max(0,s.bounce-dt*2);
      if(s.state==='prep'){s.t+=dt;if(s.t>=ITEMS[s.id].time){s.state='ready';s.readyT=0;s.bounce=1;sfx.ready();}}
      else if(s.state==='ready'){s.readyT+=dt;if(s.id==='tostado'&&s.readyT>7){s.state='burnt';s.readyT=0;G.burned++;G.shiftBurned++;sfx.burn();toast('¡Se quemó un tostado!','#B04A4A');}}
      else if(s.state==='burnt'){s.readyT+=dt;if(s.readyT>3)s.state='idle';}
    });
    if(G.trayArmT>0){G.trayArmT-=dt;if(G.trayArmT<=0)G.trayArm=-1;}
    if(G.time>=SHIFT_LEN)endShift();
  }
  G.customers.forEach(cu=>updCustomer(cu,dt));
  G.customers=G.customers.filter(cu=>!cu.dead);
  for(let i=0;i<3;i++)G.trayPop[i]=Math.max(0,G.trayPop[i]-dt*3);
  G.floaters.forEach(f=>{f.t+=dt;f.y-=dt*38;});G.floaters=G.floaters.filter(f=>f.t<f.life);
  G.flys.forEach(f=>{f.p+=dt/f.dur;if(f.p>=1&&!f.fired){f.fired=true;if(f.cb)f.cb();}});G.flys=G.flys.filter(f=>f.p<1);
  G.toasts.forEach(t=>t.t+=dt);G.toasts=G.toasts.filter(t=>t.t<2.2);
}

  else if(G.shiftLost>G.shiftServed)phr='Se fueron más de los que atendiste. ¡A ponerle onda!';
  else if(G.shiftBurned>=2)phr='Olor a tostado quemado en toda la cuadra.';
  $('shBody').innerHTML='<div class="stats"><div><b>'+G.shiftServed+'</b><span>atendidos</span></div><div><b>'+G.shiftLost+'</b><span>se fueron enojados</span></div><div><b>$'+G.shiftTips+'</b><span>propinas del turno</span></div><div><b>$'+G.money+'</b><span>en la caja</span></div></div><div class="phr">'+phr+'</div>';
  $('shGo').textContent=last?'Ver el resumen de la semana':'Promocionar con IA';
  show('sShift');
}
function cost(k){return k==='img'?35+25*G.flyerLvl:k==='voz'?45+25*G.jingleLvl:60+15*G.pieces.filter(p=>p.k==='vid').length;}
function renderPromo(){
  G.state='promo';
  $('prMoney').textContent='$'+G.money;
  const opts=[
    {k:'img',name:'Imagen',sub:'Flyer para redes',eff:'Entran más clientes (+18% por nivel).',lvl:G.flyerLvl,max:3,bg:'#F0E7FB'},
    {k:'voz',name:'Voz y música',sub:'Jingle del local',eff:'Los clientes tienen más paciencia (+22% por nivel).',lvl:G.jingleLvl,max:3,bg:'#DDF4EA'},
    {k:'vid',name:'Video',sub:'Reel corto',eff:'Hora pico en el próximo turno, con propinas x2.',lvl:-1,max:0,bg:'#FFE6D8'}];
  $('prCards').innerHTML=opts.map(o=>{const c=cost(o.k),maxed=o.lvl>=o.max&&o.max>0,sched=o.k==='vid'&&G.videoNext;
    const dis=maxed||sched||G.money<c;
    const dots=o.max?'<div class="dots">'+[0,1,2].map(i=>'<i class="'+(i<o.lvl?'on':'')+'"></i>').join('')+'</div>':'';
    const right=maxed?'<div class="cost done">Nivel máx.</div>':sched?'<div class="cost done">Programado</div>':'<div class="cost">$'+c+'</div>';
    return '<button class="pcard" data-k="'+o.k+'" '+(dis?'disabled':'')+'><div class="pic" style="background:'+o.bg+'">'+ICONS[o.k]+'</div><div class="pt"><b>'+o.name+'</b> · '+o.sub+'<small>'+o.eff+'</small>'+dots+'</div>'+right+'</button>';}).join('');
  [...$('prCards').querySelectorAll('.pcard')].forEach(b=>b.onclick=()=>{auInit();startGen(b.dataset.k);});
  const nx=G.shift===0?'Abrir la merienda':'Abrir el día '+(G.day+2);
  $('prGo').textContent=nx;
  show('sPromo');
}
function advance(){if(G.shift===0)G.shift=1;else{G.day++;G.shift=0;}showIntro();}

/* ---- generación con IA ---- */
let GEN={on:false};
const gctx=$('gnC').getContext('2d');
function startGen(k){
  const c=cost(k);if(G.money<c)return;
  G.money-=c;G.state='gen';
  const n=k==='img'?G.flyerLvl:k==='voz'?G.jingleLvl:G.pieces.filter(p=>p.k==='vid').length;
  const prompt=PROMPTS[k][n%3];
  if(k==='img')G.flyerLvl++;else if(k==='voz')G.jingleLvl++;else G.videoNext=true;
  GEN={on:true,k:k,t:0,dur:4.4,prompt:prompt,done:false,variant:n%3};
  if(k==='img'){GEN.final=document.createElement('canvas');GEN.final.width=360;GEN.final.height=440;drawFlyerArt(GEN.final.getContext('2d'),360,440,n%3,0);GEN.tmp=document.createElement('canvas');}
  $('gnK').textContent=k==='img'?'Generando imagen':k==='voz'?'Generando voz y música':'Generando video';
  $('gnPrompt').textContent='';$('gnStatus').textContent='La IA está trabajando...';$('gnBar').style.width='0%';
  $('gnGo').style.visibility='hidden';
  G.pieces.push({k:k,prompt:prompt,day:G.day+1});
  sfx.click();show('sGen');
}
function updGen(dt){
  if(!GEN.on)return;GEN.t+=dt;
  const typed=Math.min(GEN.prompt.length,Math.floor(GEN.t*60));
  $('gnPrompt').textContent=GEN.prompt.slice(0,typed);
  const p=clamp((GEN.t-1.2)/(GEN.dur-1.2),0,1);
  $('gnBar').style.width=(p*100).toFixed(1)+'%';
  drawGen(gctx,p);
  if(!GEN.done&&GEN.t>=GEN.dur){GEN.done=true;sfx.sparkle();
    $('gnStatus').textContent=GEN.k==='img'?'¡Flyer listo! Entran '+(18*G.flyerLvl)+'% más clientes.':GEN.k==='voz'?'¡Jingle listo! Los clientes tienen '+(22*G.jingleLvl)+'% más paciencia.':'¡Reel listo! El próximo turno tiene hora pico con propinas x2.';
    $('gnGo').style.visibility='visible';if(GEN.k==='voz')setTimeout(()=>sfx.jingle(),250);}
}
function drawFlyerArt(c,w,h,v,t){
  const g=c.createLinearGradient(0,0,0,h);
  const tops=['#FFF1D8','#FFD8B8','#F3EAFE'],bots=['#FFC9A8','#F7B4C8','#D9C3F2'];
  g.addColorStop(0,tops[v]);g.addColorStop(1,bots[v]);c.fillStyle=g;c.fillRect(0,0,w,h);
  c.save();c.translate(w/2,h*0.42);for(let i=0;i<14;i++){c.rotate(Math.PI*2/14);c.fillStyle='rgba(255,255,255,.28)';c.beginPath();c.moveTo(0,0);c.lineTo(-16,-260);c.lineTo(16,-260);c.fill();}c.restore();
  font(c,700,46);txt(c,'CAFELINO',w/2,52,C.lilaD,'center',8);
  font(c,600,19);txt(c,v===2?'Merendá en el barrio':'Desayunos y meriendas',w/2,90,'#B0603A');
  circ(c,w/2,h*0.42,86,'rgba(255,255,255,.55)');
  drawLogo(c,w/2,h*0.43,62,t,true);
  if(v===2){c.fillStyle='#FFE27A';}
  drawItem(c,'medialunas',w*0.2,h*0.74,78);drawItem(c,v===1?'torta':'leche',w*0.8,h*0.74,74);
  c.fillStyle=C.lilaD;rrect(c,w*0.14,h*0.86,w*0.72,40,20);c.fill();
  font(c,600,19);txt(c,'¡Te esperamos!',w/2,h*0.86+21,'#fff');
}
function drawGen(c,p){
  const w=360,h=440,t=ANIM;c.clearRect(0,0,w,h);
  if(GEN.k==='img'){
    if(p<1){const res=Math.max(5,Math.floor(Math.pow(p,2)*110)),rh=Math.max(6,Math.floor(res*h/w));
      GEN.tmp.width=res;GEN.tmp.height=rh;const tc=GEN.tmp.getContext('2d');tc.drawImage(GEN.final,0,0,res,rh);
      c.imageSmoothingEnabled=p>0.6;c.drawImage(GEN.tmp,0,0,res,rh,0,0,w,h);c.imageSmoothingEnabled=true;
      c.fillStyle='rgba(255,255,255,'+(0.5*(1-p)).toFixed(2)+')';for(let i=0;i<160*(1-p);i++){c.fillRect(Math.random()*w,Math.random()*h,3,3);}
      const sy=(t*260)%h;const lg=c.createLinearGradient(0,sy-30,0,sy);lg.addColorStop(0,'rgba(185,155,227,0)');lg.addColorStop(1,'rgba(185,155,227,.5)');c.fillStyle=lg;c.fillRect(0,sy-30,w,30);}
    else drawFlyerArt(c,w,h,GEN.variant,t);
  }else if(GEN.k==='voz'){
    const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#E9FBF2');g.addColorStop(1,'#E5D9F7');c.fillStyle=g;c.fillRect(0,0,w,h);
    drawLogo(c,w/2,110,42,t,true);
    font(c,700,26);txt(c,'Jingle Cafelino',w/2,196,C.lilaD);
    font(c,600,16);txt(c,'"Cafelino, tu rincón del barrio"',w/2,224,'#3F8C69');
    const n=36,bw=7,x0=(w-n*(bw+2))/2;
    for(let i=0;i<n;i++){const vis=i/n<=p||GEN.done;const amp=(0.25+0.75*Math.abs(Math.sin(i*0.73+t*(GEN.done?6:3))*Math.sin(i*0.31+1)));
      const bh=vis?10+amp*80:4;c.fillStyle=vis?(i%2?C.mentaD:C.lila):'#D9D0E3';rrect(c,x0+i*(bw+2),310-bh/2,bw,bh,3);c.fill();}
    for(let i=0;i<4;i++){const k=(t*0.35+i/4)%1,nx=60+i*80+Math.sin(t+i)*10,ny=380-k*120;c.save();c.globalAlpha=Math.sin(k*Math.PI)*(0.4+0.6*p);
      circ(c,nx,ny,7,C.lilaD);c.fillStyle=C.lilaD;c.fillRect(nx+5,ny-26,3,26);c.fillRect(nx+5,ny-26,10,4);c.restore();}
    font(c,600,15);txt(c,GEN.done?'0:20 · bossa lo-fi':'grabando voz... '+Math.round(p*100)+'%',w/2,410,'#6C5875');
  }else{
    c.fillStyle='#FFE6D8';c.fillRect(0,0,w,h);
    c.fillStyle='#4B3653';rrect(c,90,14,180,412,28);c.fill();
    c.save();rrect(c,98,24,164,392,22);c.clip();
    const g=c.createLinearGradient(0,24,0,416);g.addColorStop(0,'#FFE3A3');g.addColorStop(1,'#F7B4C8');c.fillStyle=g;c.fillRect(98,24,164,392);
    const fr=GEN.done?t:p*6;
    drawLogo(c,180,170+Math.sin(fr*3)*8,40,t,true);
    drawItem(c,'medialunas',130+((fr*40)%60),330,54);drawItem(c,'cafe',230,330-Math.abs(Math.sin(fr*2))*10,46);
    if(!GEN.done){c.fillStyle='rgba(75,54,83,.55)';c.fillRect(98,24+392*p,164,392*(1-p));font(c,600,15);txt(c,'frame '+Math.floor(p*90)+'/90',180,24+392*p+28,'#fff');}
    else{for(let i=0;i<5;i++){const k=(t*0.5+i/5)%1;c.save();c.globalAlpha=1-k;heartPath(c,240+Math.sin(t*2+i)*10,380-k*200,12);c.fillStyle='#F47C9C';c.fill();c.restore();}
      c.fillStyle='rgba(255,255,255,.85)';circ(c,180,250,24);c.fill();c.fillStyle=C.duraznoD;poly(c,[[172,238],[194,250],[172,262]]);c.fill();}
    for(let i=0;i<4;i++){c.fillStyle='rgba(255,255,255,.4)';rrect(c,108+i*38,34,34,4,2);c.fill();c.fillStyle='#fff';rrect(c,108+i*38,34,34*clamp(p*4-i,0,1),4,2);c.fill();}
    c.restore();
    font(c,600,15);txt(c,'15 s · vertical',w/2,h-4,'#B0603A');
  }
}

/* ---- final ---- */
function starsSVG(v){let s='';for(let i=0;i<5;i++){const fr=clamp(v-i,0,1),id='sg'+i;
  s+='<svg viewBox="0 0 24 24"><defs><linearGradient id="'+id+'"><stop offset="'+fr+'" stop-color="#FFC94D"/><stop offset="'+fr+'" stop-color="#EADCF5"/></linearGradient></defs><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z" fill="url(#'+id+')"/></svg>';}return s;}
function phrases(){const p=[];
  if(G.stars>=4.5)p.push('¡El barrio habla de tu local!');
  if(G.burned>=3)p.push('Se te quemaron más tostados que en un domingo de resaca.');
  if(G.lost>=10)p.push('Hubo más clientes enojados que en la fila del banco un lunes.');
  else if(G.lost===0&&G.served>0)p.push('Ni un cliente enojado. ¿Sos humano o una cafetera automática?');
  if(G.totalTips>=600)p.push('Con estas propinas te comprás otra cafetera y te sobra para facturas.');
  if(G.pieces.length>=6)p.push('Tu community manager con IA pide aumento.');
  else if(G.pieces.length===0)p.push('Ni un flyer, che. El boca en boca no hace milagros.');
  if(G.served>=120)p.push('Atendiste a medio barrio. La otra mitad viene mañana.');
  if(G.stars<2.5)p.push('Las reseñas dicen: "lindo gato, lenta la atención".');
  if(!p.length)p.push('Nada mal para un emprendimiento de barrio. ¡Mañana más!');
  return p.slice(0,3);}
function showFinal(){
  G.state='final';
  const rec=loadRecord();const isRec=!rec||G.totalTips>rec.tips;
  if(isRec)saveRecord({tips:G.totalTips,stars:+G.stars.toFixed(1),served:G.served});
  const pcs=G.pieces.length?G.pieces.map(p=>'<div class="piece">'+ICONS[p.k]+'<div><b>'+(p.k==='img'?'Flyer':p.k==='voz'?'Jingle':'Reel')+' · día '+p.day+'</b><br>"'+p.prompt+'"</div></div>').join(''):'<p>No generaste ninguna pieza esta vez.</p>';
  $('fnCard').innerHTML='<div class="kicker">Fin de la semana</div><h3>¡Cerraste 5 días en Cafelino!</h3>'+
   '<div class="starrow">'+starsSVG(G.stars)+'</div><p>El local quedó con '+G.stars.toFixed(1)+' estrellas</p>'+
   '<div class="stats"><div><b>'+G.served+'</b><span>clientes atendidos</span></div><div><b>$'+G.totalTips+'</b><span>propinas en total</span></div><div><b>'+G.lost+'</b><span>se fueron enojados</span></div><div><b>'+G.hearts+'</b><span>corazones</span></div></div>'+
   phrases().map(t=>'<div class="phr">'+t+'</div>').join('')+
   '<h4>Tus piezas de IA</h4>'+pcs+
   (isRec?'<div class="newrec">¡Nuevo récord: $'+G.totalTips+'!</div>':'<p>Récord: $'+rec.tips+' en propinas</p>')+
   '<br><button class="btn" id="fnGo">Jugar de nuevo</button>';
  $('fnGo').onclick=()=>{sfx.click();newGame('intro');AU.playing=true;showIntro();};
  show('sFinal');
}

/* ================== RENDER / LOOP ================== */
const lctx=$('logoC').getContext('2d');
function render(){
  ctx.setTransform(SC*DPR,0,0,SC*DPR,0,0);
  const mer=G.state!=='title'&&G.shift===1;
  drawBackground(ctx,mer);
  if(G.state==='title'){ctx.save();ctx.translate(0,95);drawScene(ctx,false);ctx.restore();
    lctx.clearRect(0,0,280,280);drawLogo(lctx,140,160,80,ANIM,true);}
  else{drawScene(ctx,mer);drawHUD(ctx);drawBottom(ctx);}
  drawFX(ctx);
}
function frame(t){
  const dt=Math.min(0.05,Math.max(0,(t-LAST)/1000));LAST=t;
  if(!G.paused){ANIM+=dt;update(dt);}
  updGen(dt);render();requestAnimationFrame(frame);
}
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;
  SC=Math.min(vw/W,vh/H);DPR=Math.min(window.devicePixelRatio||1,2);
  const g=$('game');g.style.width=W*SC+'px';g.style.height=H*SC+'px';g.style.fontSize=(20*SC)+'px';
  g.style.borderRadius=(vw<=W*SC+2)?'0':'';
  cv.width=Math.round(W*SC*DPR);cv.height=Math.round(H*SC*DPR);cv.style.width=W*SC+'px';cv.style.height=H*SC+'px';
}

/* ================== EVENTOS ================== */
cv.addEventListener('pointerdown',e=>{
  if(G.state!=='play'||G.paused)return;e.preventDefault();auInit();
  const r=cv.getBoundingClientRect();handleTap((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);
});
$('sTitle').addEventListener('pointerdown',()=>{auInit();newGame('intro');AU.playing=true;sfx.bell();showIntro();});
$('inGo').onclick=()=>{auInit();sfx.click();startShift();};
$('shGo').onclick=()=>{sfx.click();if(G.day===4&&G.shift===1)showFinal();else renderPromo();};
$('prGo').onclick=()=>{sfx.click();advance();};
$('gnGo').onclick=()=>{GEN.on=false;sfx.coins();renderPromo();};
function setPause(v){G.paused=v;if(v)show('sPause');else show(null);}
$('btnPause').onclick=()=>{if(G.state==='play'){sfx.click();setPause(true);}};
$('paGo').onclick=()=>{setPause(false);sfx.click();};
$('paQuit').onclick=()=>{G.paused=false;AU.playing=false;newGame('title');show('sTitle');refreshTitle();};
$('btnMute').onclick=()=>{auInit();MUTED=!MUTED;if(AU.master)AU.master.gain.value=MUTED?0:0.9;updHudBtns();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play'&&!G.paused)setPause(true);});
window.addEventListener('resize',resize);
function refreshTitle(){const r=loadRecord();$('recTitle').textContent=r?'Récord: $'+r.tips+' en propinas · '+r.stars+' estrellas':'Desayunos y meriendas del barrio';}

newGame('title');resize();refreshTitle();updHudBtns();
requestAnimationFrame(frame);
</script>
</body>
